<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmacia — Cambiar contraseña</title>
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>
  <div class="barra-superior">
    <div class="titulo">Sistema de Farmacia</div>
    <nav>
      <a href="fidelizacion.html">Fidelización</a>
      <a href="usuarios.html" id="enlace-usuarios" class="oculto">Usuarios</a>
    </nav>
    <div class="usuario-info" id="usuario-info"></div>
  </div>

  <main>
    <div class="panel" style="max-width:380px; margin:0 auto;">
      <h2>Cambiar contraseña</h2>
      <p id="aviso-obligatorio" style="color:#4a6572; font-size:13px;"></p>

      <form id="form-cambiar-password">
        <label for="password-actual">Contraseña actual</label>
        <input type="password" id="password-actual" required />

        <label for="password-nueva">Nueva contraseña</label>
        <input type="password" id="password-nueva" required minlength="6" />

        <label for="password-nueva-confirmar">Repetir nueva contraseña</label>
        <input type="password" id="password-nueva-confirmar" required minlength="6" />

        <button type="submit" class="boton-primario">Guardar</button>
        <div class="mensaje-error" id="error-cambiar-password"></div>
        <div class="mensaje-exito" id="exito-cambiar-password"></div>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/cambiar-password.js"></script>
</body>
</html>
