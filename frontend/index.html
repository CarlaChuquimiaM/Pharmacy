<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Biofar — Iniciar sesión
  </title>

  <link
    rel="stylesheet"
    href="css/estilo.css"
  >

</head>


<body>


<div class="pantalla-login">


  <div class="tarjeta-login">


    <img
      src="img/logo-biofar.png"
      alt="Farmacia Biofar"
      class="login-logo"
    >


    <h1>
      Sistema de Fidelización
    </h1>


    <div class="login-subtitulo">
      Cuidamos de ti
    </div>


    <form id="form-login">


      <label for="username">
        Usuario
      </label>


      <input
        type="text"
        id="username"
        autocomplete="username"
        placeholder="Ingresa tu usuario"
        required
      >


      <label for="password">
        Contraseña
      </label>


      <input
        type="password"
        id="password"
        autocomplete="current-password"
        placeholder="Ingresa tu contraseña"
        required
      >


      <button
        type="submit"
        class="boton-primario"
        style="width:100%; margin-top:22px;"
      >
        Ingresar al sistema
      </button>


      <div
        class="mensaje-error"
        id="error-login"
      ></div>


    </form>

  </div>

</div>


<script src="js/api.js"></script>

<script src="js/auth.js"></script>


</body>

</html>
